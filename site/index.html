<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="referrer" content="no-referrer">
<title>Meine Kanäle</title>
<style>
  :root {
    --bg: #0f0f0f; --card: #1a1a1a; --line: #2a2a2a;
    --fg: #f1f1f1; --muted: #9a9a9a; --accent: #ff3b30; --chip: #272727;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f6f6; --card: #fff; --line: #e5e5e5; --fg: #111; --muted: #666; --chip: #ececec; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; border-bottom: 1px solid var(--line);
  }
  .top { display: flex; align-items: center; gap: 10px; }
  h1 { font-size: 20px; margin: 0; flex: 1; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  button, .chip { font: inherit; color: var(--fg); background: var(--chip); border: 0;
    border-radius: 999px; padding: 7px 12px; cursor: pointer; white-space: nowrap; flex: none; }
  .chips { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  input[type=search] { width: 100%; margin-top: 10px; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; }
  main { padding: 12px 12px calc(env(safe-area-inset-bottom) + 24px); max-width: 720px; margin: 0 auto;
    display: grid; gap: 14px; }
  @media (min-width: 760px) { main { grid-template-columns: 1fr 1fr; max-width: 1100px; } }
  .card { background: var(--card); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
  .ch { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  .ch a { color: var(--fg); text-decoration: none; font-weight: 600; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
    padding: 2px 7px; border-radius: 999px; }
  .thumb { display: block; position: relative; aspect-ratio: 16/9; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { padding: 10px 12px 12px; }
  .info a { color: var(--fg); text-decoration: none; }
  .title { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .err { color: #ff9f0a; font-size: 12px; padding: 0 12px 10px; }
  details { border-top: 1px solid var(--line); }
  summary { padding: 10px 12px; color: var(--muted); font-size: 13px; cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  details[open] summary { color: var(--fg); }
  .older { display: flex; gap: 10px; padding: 8px 12px; text-decoration: none; color: var(--fg); }
  .older img { width: 128px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; flex: none; background:#000; }
  .older .title { font-size: 14px; font-weight: 500; }
  .seen .thumb img { opacity: .55; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; grid-column: 1/-1; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Meine Kanäle</h1>
    <button id="reload" aria-label="Neu laden">↻</button>
  </div>
  <div class="meta" id="meta">Lade …</div>
  <div class="chips" role="group" aria-label="Sortierung und Filter">
    <button class="chip" data-sort="new" aria-pressed="true">Neueste zuerst</button>
    <button class="chip" data-sort="az" aria-pressed="false">A–Z</button>
    <button class="chip" id="onlyNew" aria-pressed="false">Nur ungesehen</button>
    <button class="chip" id="markAll">Alle gesehen</button>
  </div>
  <input type="search" id="q" placeholder="Kanal oder Titel suchen" autocomplete="off">
</header>
<main id="list"></main>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  let data = null;
  let seen = store.get("seen", {});            // channelId -> videoId des zuletzt gesehenen neuesten Videos
  let sort = store.get("sort", "new");
  let onlyNew = store.get("onlyNew", false);

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rtf = new Intl.RelativeTimeFormat("de", { numeric: "auto" });
  function ago(iso) {
    const s = (new Date(iso) - Date.now()) / 1000;
    const steps = [["year", 31536000], ["month", 2592000], ["week", 604800], ["day", 86400], ["hour", 3600], ["minute", 60]];
    for (const [u, n] of steps) if (Math.abs(s) >= n) return rtf.format(Math.round(s / n), u);
    return "gerade eben";
  }
  const views = (n) => n == null ? "" : new Intl.NumberFormat("de", { notation: "compact" }).format(n) + " Aufrufe · ";
  // mqdefault = 320×180, echtes 16:9 ohne schwarze Balken
  const thumb = (id) => `https://i.ytimg.com/vi/${encodeURIComponent(id)}/mqdefault.jpg`;
  const watch = (id) => `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;
  const isNew = (c) => c.videos?.[0] && seen[c.id] !== c.videos[0].id;

  function render() {
    if (!data) return;
    const q = $("#q").value.trim().toLowerCase();
    let chans = data.channels.slice();
    if (q) chans = chans.filter((c) => c.name.toLowerCase().includes(q) ||
      (c.videos || []).some((v) => v.title.toLowerCase().includes(q)));
    if (onlyNew) chans = chans.filter(isNew);
    chans.sort(sort === "az"
      ? (a, b) => a.name.localeCompare(b.name, "de")
      : (a, b) => (b.videos?.[0]?.published || "").localeCompare(a.videos?.[0]?.published || ""));

    const unseen = data.channels.filter(isNew).length;
    $("#meta").textContent = `${data.channels.length} Kanäle · ${unseen} neu · Stand ${ago(data.generated)}`;
    document.querySelectorAll("[data-sort]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.sort === sort));
    $("#onlyNew").setAttribute("aria-pressed", onlyNew);

    if (!chans.length) { $("#list").innerHTML = `<div class="empty">Nichts gefunden.</div>`; return; }
    $("#list").innerHTML = chans.map((c) => {
      const [v, ...older] = c.videos || [];
      const err = c.error ? `<div class="err">⚠︎ ${esc(c.error)}</div>` : "";
      if (!v) return `<article class="card"><div class="ch"><a href="${esc(c.url)}">${esc(c.name)}</a></div>${err}</article>`;
      return `<article class="card ${isNew(c) ? "" : "seen"}" data-ch="${esc(c.id)}">
        <div class="ch"><a href="${esc(c.url)}/videos">${esc(c.name)}</a>${isNew(c) ? '<span class="badge">NEU</span>' : ""}</div>
        ${err}
        <a class="thumb" href="${watch(v.id)}" data-v="${esc(v.id)}"><img loading="lazy" src="${thumb(v.id)}" alt=""></a>
        <div class="info"><a href="${watch(v.id)}" data-v="${esc(v.id)}">
          <div class="title">${esc(v.title)}</div>
          <div class="sub">${views(v.views)}${ago(v.published)}</div></a></div>
        ${older.length ? `<details><summary>${older.length} ältere Videos</summary>
          ${older.map((o) => `<a class="older" href="${watch(o.id)}"><img loading="lazy" src="${thumb(o.id)}" alt="">
            <div><div class="title">${esc(o.title)}</div><div class="sub">${ago(o.published)}</div></div></a>`).join("")}
        </details>` : ""}
      </article>`;
    }).join("");
  }

  // Tap auf neuestes Video -> als gesehen markieren. Link öffnet im SELBEN Tab (kein Tab-Wildwuchs).
  $("#list").addEventListener("click", (e) => {
    const a = e.target.closest("a[data-v]");
    if (!a) return;
    const card = a.closest("[data-ch]");
    if (card) { seen[card.dataset.ch] = a.dataset.v; store.set("seen", seen); }
  });
  document.querySelectorAll("[data-sort]").forEach((b) => b.addEventListener("click", () => {
    sort = b.dataset.sort; store.set("sort", sort); render();
  }));
  $("#onlyNew").addEventListener("click", () => { onlyNew = !onlyNew; store.set("onlyNew", onlyNew); render(); });
  $("#markAll").addEventListener("click", () => {
    data.channels.forEach((c) => { if (c.videos?.[0]) seen[c.id] = c.videos[0].id; });
    store.set("seen", seen); render();
  });
  $("#q").addEventListener("input", render);
  $("#reload").addEventListener("click", load);

  async function load() {
    try {
      const r = await fetch("feed.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      data = await r.json();
      render();
    } catch (e) {
      $("#meta").textContent = "Konnte feed.json nicht laden (" + e.message + ")";
    }
  }
  // Beim Zurückkehren aus YouTube (Back-Button / bfcache) Badges aktualisieren
  window.addEventListener("pageshow", (e) => { if (e.persisted) { seen = store.get("seen", {}); render(); } });
  load();
})();
</script>
</body>
</html>
