<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="referrer" content="no-referrer">
<title>Meine Kanäle</title>
<style>
  :root {
    --bg: #0f0f0f; --card: #1a1a1a; --line: #2a2a2a; --fg: #f1f1f1; --muted: #9a9a9a;
    --accent: #ff3b30; --chip: #272727; --ok: #30d158; --warn: #ff9f0a;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f6f6; --card: #fff; --line: #e3e3e3; --fg: #111; --muted: #666; --chip: #e9e9e9; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: var(--fg); background: var(--chip); border: 0; border-radius: 999px;
    padding: 6px 12px; cursor: pointer; white-space: nowrap; flex: none; }
  button:disabled { opacity: .4; }
  .icon { width: 36px; height: 36px; padding: 0; font-size: 17px; }

  header { padding: calc(env(safe-area-inset-top) + 8px) 12px 6px; }
  .head { display: flex; align-items: center; gap: 8px; }
  .head .ttl { flex: 1; min-width: 0; }
  h1 { font-size: 20px; margin: 0; }
  .meta { color: var(--muted); font-size: 12px; }
  .status { font-size: 13px; margin-top: 6px; }
  .status.err { color: var(--warn); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-top: 8px; }
  .panel p { margin: 0 0 8px; }
  .panel input, .panel select, #q { width: 100%; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); font: inherit; }
  .panel .rowf { display: flex; gap: 6px; margin-top: 6px; }
  .panel .rowf > * { flex: 1; }
  .panel .rowf > button { flex: none; }
  .panel h2 { font-size: 13px; margin: 12px 0 4px; color: var(--muted); font-weight: 600; }

  nav { position: sticky; top: 0; z-index: 5; padding: 6px 12px 8px;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .tabs { display: flex; background: var(--chip); border-radius: 10px; padding: 2px; }
  .tabs button { flex: 1; border-radius: 8px; background: none; padding: 6px 2px; font-size: 13px; min-width: 0; }
  .tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); font-weight: 600; }
  .tabs .n { opacity: .65; font-size: 11px; margin-left: 2px; }
  .chips { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { font-size: 13px; padding: 5px 10px; }
  .chips button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .chips .sep { width: 1px; background: var(--line); flex: none; margin: 2px 2px; }
  #q { margin-top: 8px; }

  main { overflow-x: clip; padding: 4px 8px calc(env(safe-area-inset-bottom) + 80px); max-width: 1200px; margin: 0 auto; }
  .grid { display: grid; gap: 0 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 820px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  h3.sec { font-size: 13px; color: var(--muted); margin: 14px 4px 2px; font-weight: 600; grid-column: 1/-1; }
  .item { border-bottom: 1px solid var(--line); padding: 8px 4px; }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .th { flex: none; width: 112px; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: var(--chip);
    display: grid; place-items: center; color: var(--muted); font-size: 11px; text-decoration: none; }
  .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { flex: 1; min-width: 0; }
  .ch { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; min-width: 0; }
  .ch .name { min-width: 0; color: var(--fg); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; flex: none; }
  .title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    color: var(--fg); text-decoration: none; font-size: 14px; font-weight: 500; margin-top: 1px; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sub button { font-size: 11px; padding: 1px 8px; }
  .why { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 2px; }
  .err { font-size: 12px; color: var(--warn); margin-top: 2px; }
  .acts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .acts button { font-size: 12px; padding: 4px 9px; }
  .acts .yes { background: color-mix(in srgb, var(--ok) 25%, var(--chip)); }
  .acts .no { background: color-mix(in srgb, var(--accent) 22%, var(--chip)); }
  .more { background: none; color: var(--muted); padding: 2px 4px; font-size: 18px; line-height: 1; }
  .item.seen .th img { opacity: .5; }
  .item.pending { opacity: .6; }
  .older { margin: 6px 0 0 122px; display: grid; gap: 6px; min-width: 0; }
  .older[hidden] { display: none; }
  .older a > div { min-width: 0; }
  .older a { display: flex; gap: 8px; text-decoration: none; color: var(--fg); font-size: 13px; }
  .older img { width: 72px; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; flex: none; background: var(--chip); }
  .older .meta { margin-top: 1px; }
  .compact .th { width: auto; aspect-ratio: auto; background: none; }
  .empty { color: var(--muted); text-align: center; padding: 40px 16px; grid-column: 1/-1; }

  .sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet[hidden] { display: none; }
  .sheet .card { background: var(--card); width: 100%; max-width: 520px; border-radius: 16px 16px 0 0;
    padding: 14px 14px calc(env(safe-area-inset-bottom) + 14px); display: grid; gap: 8px; }
  .sheet .card b { font-size: 16px; }
  .sheet .card button, .sheet .card a.btn { width: 100%; padding: 11px; border-radius: 11px; text-align: center; }
  .sheet a.btn { display: block; background: var(--chip); color: var(--fg); text-decoration: none; }
  .sheet select { width: 100%; padding: 10px; border-radius: 11px; background: var(--chip); color: var(--fg); border: 0; font: inherit; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 16px); z-index: 15;
    background: var(--fg); color: var(--bg); border-radius: 12px; padding: 10px 12px; display: flex; gap: 12px; align-items: center;
    max-width: calc(100% - 24px); font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
  .toast[hidden] { display: none; }
  .toast button { background: none; color: var(--bg); font-weight: 700; padding: 2px 4px; }
  #reload.spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="head">
    <div class="ttl"><h1>Meine Kanäle</h1><div class="meta" id="meta">Lade …</div></div>
    <button id="reload" class="icon" aria-label="Diese Ansicht bei YouTube aktualisieren">↻</button>
    <button id="settingsBtn" class="icon" aria-label="Einstellungen">⚙︎</button>
  </div>
  <div id="status" class="status" hidden></div>
  <form id="settings" class="panel" hidden>
    <p class="meta">GitHub-Token (fine-grained, nur dieses Repo, „Actions: Read and write“). Wird nur in diesem Browser gespeichert.</p>
    <div class="rowf"><input type="password" id="token" placeholder="github_pat_…" autocomplete="off">
      <button type="submit">Speichern</button><button type="button" id="tokenClear">Löschen</button></div>
    <h2>Kanal hinzufügen</h2>
    <div class="rowf"><input id="addHandle" placeholder="@handle" autocomplete="off" autocapitalize="off">
      <select id="addCat"></select><button type="button" id="addBtn">+</button></div>
  </form>
</header>

<nav>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="chips" id="cats"></div>
  <div class="chips" id="tools"></div>
  <input type="search" id="q" placeholder="Kanal oder Titel suchen" autocomplete="off" hidden>
</nav>
<main><div class="grid" id="list"></div></main>

<div class="sheet" id="sheet" hidden>
  <div class="card" id="sheetCard"></div>
</div>
<div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastUndo">Rückgängig</button></div>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  // ------------------------------------------------------------ Konstanten
  const VIEWS = [
    { id: "active", label: "Feed", scope: "active" },
    { id: "suggested", label: "Vorschläge", scope: "suggested" },
    { id: "parked", label: "Geparkt", scope: "parked" },
    { id: "rejected", label: "Abgelehnt", scope: null },
  ];
  const STATUS_LABEL = { active: "In den Feed", suggested: "Zu Vorschlägen", parked: "Parken", rejected: "Ablehnen" };
  const STATUS_DONE = { active: "In den Feed übernommen", suggested: "Zu Vorschlägen verschoben", parked: "Geparkt", rejected: "Abgelehnt" };
  const SORTS = { new: "Neueste", cat: "Kategorien", az: "A–Z" };
  const AUTO_REFRESH_AFTER_MIN = 60;
  const FLUSH_DELAY_MS = 2500;          // Zeit zum Sammeln/Rückgängigmachen vor dem Senden
  const POLL_MS = 4000, POLL_MAX_MS = 4 * 60 * 1000, MAX_TRIES = 3;
  const OWNER = location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : "3phi";
  const REPO = location.pathname.split("/").filter(Boolean)[0] || "MySimpleStreamOrganizer";
  const WORKFLOW = "update.yml";

  // ------------------------------------------------------------ Zustand
  let data = null;                                   // data.json: {generated, scopes, config, videos}
  let view = store.get("view", "active");
  let cat = store.get("cat", "all");
  let sorts = store.get("sorts", { active: "new", suggested: "cat", parked: "cat", rejected: "cat" });
  let onlyNew = store.get("onlyNew", false);
  let seen = store.get("seen", {});                  // channelId -> zuletzt angetippte neueste Video-ID
  let ops = store.get("pendingOps", {});             // key -> {id?, handle?, status?, category?, tries}
  let scopesReq = store.get("pendingScopes", {});    // scope -> {before}
  let flushTimer = null, polling = false, lastDispatch = 0, toastTimer = null, undoFn = null;

  const saveOps = () => { store.set("pendingOps", ops); store.set("pendingScopes", scopesReq); };

  // ------------------------------------------------------------ Hilfen
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rtf = new Intl.RelativeTimeFormat("de", { numeric: "auto" });
  function ago(iso) {
    if (!iso) return "nie";
    const s = (new Date(iso) - Date.now()) / 1000;
    for (const [u, n] of [["year", 31536000], ["month", 2592000], ["week", 604800], ["day", 86400], ["hour", 3600], ["minute", 60]])
      if (Math.abs(s) >= n) return rtf.format(Math.round(s / n), u);
    return "gerade eben";
  }
  const views = (n) => n == null ? "" : new Intl.NumberFormat("de", { notation: "compact" }).format(n) + " · ";
  const thumb = (id) => `https://i.ytimg.com/vi/${encodeURIComponent(id)}/mqdefault.jpg`;
  const watch = (id) => `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;
  const keyOf = (c) => c.id || (c.handle || "").toLowerCase();
  const catLabel = (id) => data?.config?.categories.find((c) => c.id === id)?.label || "Sonstiges";
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function findCfg(o) {
    const list = data?.config?.channels || [];
    return list.find((c) => (o.id && c.id === o.id) || (o.handle && c.handle && c.handle.toLowerCase() === o.handle.toLowerCase()));
  }
  const confirmed = (o) => { const c = findCfg(o); return !!c && (!o.status || c.status === o.status) && (!o.category || c.category === o.category); };

  // Konfiguration aus data.json + noch nicht bestätigte Änderungen (optimistische Anzeige)
  function channels() {
    const list = (data?.config?.channels || []).map((c) => ({ ...c }));
    for (const o of Object.values(ops)) {
      const c = list.find((x) => (o.id && x.id === o.id) || (o.handle && x.handle && x.handle.toLowerCase() === o.handle.toLowerCase()));
      if (c) { if (o.status) c.status = o.status; if (o.category) c.category = o.category; c.pending = true; }
      else if (o.handle) list.push({ handle: o.handle, name: o.handle, status: o.status || "active", category: o.category, pending: true, placeholder: true });
    }
    return list;
  }
  const vidsOf = (c) => (c.id && data?.videos?.[c.id]) || null;
  const latest = (c) => vidsOf(c)?.videos?.[0] || null;
  const isNew = (c) => { const v = latest(c); return !!v && seen[c.id] !== v.id; };

  // ------------------------------------------------------------ Rendering
  function render() {
    if (!data) return;
    const all = channels();
    const inView = all.filter((c) => c.status === view);
    const vDef = VIEWS.find((v) => v.id === view);

    // Tabs mit Zählern
    $("#tabs").innerHTML = VIEWS.map((v) => {
      const n = all.filter((c) => c.status === v.id).length;
      return `<button role="tab" data-view="${v.id}" aria-selected="${v.id === view}">${v.label}<span class="n">${n}</span></button>`;
    }).join("");

    // Kategorie-Chips (nur Kategorien, die in dieser Ansicht vorkommen)
    const cats = data.config.categories.filter((k) => inView.some((c) => c.category === k.id));
    if (cat !== "all" && !cats.some((k) => k.id === cat)) cat = "all";
    $("#cats").innerHTML = [`<button data-cat="all" aria-pressed="${cat === "all"}">Alle ${inView.length}</button>`,
      ...cats.map((k) => `<button data-cat="${k.id}" aria-pressed="${cat === k.id}">${esc(k.label)} ${inView.filter((c) => c.category === k.id).length}</button>`)].join("");

    // Werkzeuge
    const sort = sorts[view] || "new";
    $("#tools").innerHTML = [
      view !== "rejected" ? `<button id="sortBtn">↕ ${SORTS[sort]}</button>` : "",
      view === "active" ? `<button id="onlyNewBtn" aria-pressed="${onlyNew}">Nur ungesehen</button><button id="markAll">Alle gesehen</button>` : "",
      `${view !== "rejected" ? '<span class="sep"></span>' : ""}<button id="searchBtn" aria-pressed="${!$("#q").hidden}">Suchen</button>`,
    ].join("");

    // Meta-Zeile: Stand der aktuellen Ansicht
    const sc = vDef.scope && data.scopes?.[vDef.scope];
    $("#meta").textContent = vDef.scope
      ? `${view === "active" ? all.filter((c) => c.status === "active" && isNew(c)).length + " neu · " : ""}Videos geladen ${ago(sc?.at)}${sc?.failed ? ` · ${sc.failed} Fehler` : ""}`
      : "Wird nicht geladen – nur als Liste";
    $("#reload").disabled = !vDef.scope;

    // Liste filtern & sortieren
    const q = $("#q").hidden ? "" : $("#q").value.trim().toLowerCase();
    let items = inView.filter((c) => cat === "all" || c.category === cat);
    if (q) items = items.filter((c) => (c.name || c.handle || "").toLowerCase().includes(q) ||
      (vidsOf(c)?.videos || []).some((v) => v.title.toLowerCase().includes(q)));
    if (view === "active" && onlyNew) items = items.filter(isNew);
    const byNew = (a, b) => (latest(b)?.published || "").localeCompare(latest(a)?.published || "") || byName(a, b);
    const byName = (a, b) => (a.name || a.handle || "").localeCompare(b.name || b.handle || "", "de");
    const catIdx = (c) => data.config.categories.findIndex((k) => k.id === c.category);
    if (view === "rejected") items.sort((a, b) => catIdx(a) - catIdx(b) || byName(a, b));
    else if (sort === "az") items.sort(byName);
    else if (sort === "cat") items.sort((a, b) => catIdx(a) - catIdx(b) || byNew(a, b));
    else items.sort(byNew);

    if (!items.length) {
      const empty = { active: "Keine Kanäle im Feed.", suggested: "Keine offenen Vorschläge.", parked: "Nichts geparkt.", rejected: "Nichts abgelehnt." };
      $("#list").innerHTML = `<div class="empty">${q || cat !== "all" || onlyNew ? "Nichts gefunden." : empty[view]}</div>`;
      return;
    }
    let html = "", lastCat = null;
    const grouped = view === "rejected" || sort === "cat";
    for (const c of items) {
      if (grouped && c.category !== lastCat && cat === "all") { html += `<h3 class="sec">${esc(catLabel(c.category))}</h3>`; lastCat = c.category; }
      html += itemHtml(c);
    }
    $("#list").innerHTML = html;
  }

  function itemHtml(c) {
    const k = esc(keyOf(c));
    const v = latest(c);
    const d = vidsOf(c);
    const name = esc(c.name || c.handle);
    const chUrl = c.id ? `https://www.youtube.com/channel/${encodeURIComponent(c.id)}/videos` : "#";
    const fresh = view === "active" && isNew(c);
    const more = `<button class="more" data-more="${k}" aria-label="Aktionen für ${name}">⋯</button>`;
    const acts = {
      suggested: `<div class="acts"><button class="yes" data-set="active" data-k="${k}">✓ Übernehmen</button><button class="no" data-set="rejected" data-k="${k}">✕ Ablehnen</button></div>`,
      parked: `<div class="acts"><button class="yes" data-set="active" data-k="${k}">In den Feed</button></div>`,
      rejected: `<div class="acts"><button data-set="suggested" data-k="${k}">Wiederherstellen</button></div>`,
    }[view] || "";
    const note = c.placeholder ? `<div class="meta">wird hinzugefügt …</div>`
      : c.error ? `<div class="err">⚠︎ ${esc(c.error)}</div>`
      : d?.error ? `<div class="err">⚠︎ ${esc(d.error)}</div>` : "";
    const why = view === "suggested" && c.reason ? `<div class="why">${esc(c.reason)}</div>` : "";

    if (view === "rejected") {
      return `<article class="item compact ${c.pending ? "pending" : ""}"><div class="row"><div class="body">
        <div class="ch"><a class="name" href="${chUrl}">${name}</a><span>${esc(catLabel(c.category))}</span></div>${acts}</div>${more}</div></article>`;
    }
    const older = (d?.videos || []).slice(1);
    const thumbHtml = v
      ? `<a class="th" href="${watch(v.id)}" data-v="${esc(v.id)}" data-ch="${esc(c.id)}"><img loading="lazy" src="${thumb(v.id)}" alt=""></a>`
      : `<a class="th" href="${chUrl}">${c.placeholder ? "…" : "nicht geladen"}</a>`;
    return `<article class="item ${view === "active" && !fresh ? "seen" : ""} ${c.pending ? "pending" : ""}">
      <div class="row">${thumbHtml}
        <div class="body">
          <div class="ch"><a class="name" href="${chUrl}">${name}</a>${fresh ? '<span class="badge">NEU</span>' : ""}</div>
          ${v ? `<a class="title" href="${watch(v.id)}" data-v="${esc(v.id)}" data-ch="${esc(c.id)}">${esc(v.title)}</a>
          <div class="sub"><span>${views(v.views)}${ago(v.published)}</span>${older.length ? `<button data-older>+${older.length}</button>` : ""}</div>`
          : `<div class="sub">${view === "active" ? "Noch keine Videos geladen" : "Videos werden nur bei Bedarf geladen (↻)"}</div>`}
          ${why}${note}${acts}
        </div>${more}
      </div>
      ${older.length ? `<div class="older" hidden>${older.map((o) => `<a href="${watch(o.id)}"><img loading="lazy" src="${thumb(o.id)}" alt="">
        <div><div class="title">${esc(o.title)}</div><div class="meta">${ago(o.published)}</div></div></a>`).join("")}</div>` : ""}
    </article>`;
  }

  // ------------------------------------------------------------ Änderungen (optimistisch + kumulativ senden)
  function setChannel(c, patch, { toast = true } = {}) {
    const k = keyOf(c);
    const before = { status: c.status, category: c.category };
    const o = { ...(ops[k] || {}), id: c.id || undefined, handle: c.handle || undefined, ...patch, tries: 0 };
    ops[k] = o;
    if (confirmed(o)) delete ops[k];                 // zurück auf gespeicherten Stand -> nichts zu senden
    saveOps(); render(); scheduleFlush();
    if (toast && patch.status) showToast(`${c.name || c.handle}: ${STATUS_DONE[patch.status]}`, () => setChannel({ ...c, ...patch }, before, { toast: false }));
  }

  function requestScope(scope) {
    if (!scope) return;
    scopesReq[scope] = { before: data?.scopes?.[scope]?.at || null };
    saveOps(); scheduleFlush(300);
  }

  function scheduleFlush(ms = FLUSH_DELAY_MS) {
    clearTimeout(flushTimer);
    if (!Object.keys(ops).length && !Object.keys(scopesReq).length) return;
    flushTimer = setTimeout(flush, ms);
  }

  async function flush() {
    const token = store.get("ghToken", "");
    if (!token) {
      $("#settings").hidden = false;
      setStatus("Zum Speichern und Laden wird einmalig ein GitHub-Token benötigt. Änderungen bleiben vorgemerkt.", true);
      return;
    }
    const opList = Object.values(ops).map(({ id, handle, status, category }) => ({ id, handle, status, category }));
    const scope = Object.keys(scopesReq).join(",") || "none";
    $("#reload").classList.add("spin");
    try {
      const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`, {
        method: "POST",
        headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ ref: "main", inputs: { scope, ops: opList.length ? JSON.stringify(opList) : "" } }),
      });
      if (r.status === 401 || r.status === 403) throw new Error(`Token ungültig, abgelaufen oder ohne Actions-Recht (${r.status})`);
      if (r.status === 422) throw new Error("Workflow lehnt die Eingaben ab (422) – ist die neueste Version deployed?");
      if (!r.ok) throw new Error(`GitHub antwortet ${r.status}`);
      lastDispatch = Date.now();
      for (const o of Object.values(ops)) o.tries = (o.tries || 0) + 1;
      saveOps();
      poll();
    } catch (e) {
      $("#reload").classList.remove("spin");
      setStatus("⚠︎ " + (e.message || e) + " – wird beim nächsten Öffnen erneut versucht.", true);
    }
  }

  function describePending() {
    const n = Object.keys(ops).length, s = Object.keys(scopesReq);
    const parts = [];
    if (n) parts.push(`${n} Änderung${n > 1 ? "en" : ""} speichern`);
    if (s.length) parts.push(s.map((x) => VIEWS.find((v) => v.scope === x)?.label).join(" + ") + " laden");
    return parts.join(", ");
  }

  async function poll() {
    if (polling) return;
    polling = true;
    while (Object.keys(ops).length || Object.keys(scopesReq).length) {
      if (Date.now() - lastDispatch > POLL_MAX_MS) break;
      setStatus(`${describePending()} … ${Math.round((Date.now() - lastDispatch) / 1000)} s`);
      await sleep(POLL_MS);
      try { data = await fetchData(); reconcile(); render(); } catch {}
    }
    polling = false;
    $("#reload").classList.remove("spin");
    if (Object.keys(ops).length || Object.keys(scopesReq).length) {
      // Zeitüberschreitung: Ladeaufträge verwerfen, Änderungen begrenzt erneut versuchen
      scopesReq = {};
      const dropped = [];
      for (const [k, o] of Object.entries(ops)) if ((o.tries || 0) >= MAX_TRIES) { dropped.push(o.handle || o.id); delete ops[k]; }
      saveOps(); render();
      setStatus(dropped.length ? `⚠︎ Konnte nicht gespeichert werden: ${dropped.join(", ")}`
        : "⚠︎ GitHub hat nicht rechtzeitig geantwortet – siehe Actions-Tab. Änderungen bleiben vorgemerkt.", true);
    } else {
      const failed = Object.values(data?.scopes || {}).reduce((n, s) => n + (s.failed || 0), 0);
      setStatus(failed ? `Fertig – ${failed} Kanal/Kanäle nicht erreichbar.` : "");
    }
  }

  function reconcile() {
    for (const [k, o] of Object.entries(ops)) if (confirmed(o)) delete ops[k];
    for (const [s, req] of Object.entries(scopesReq)) if ((data?.scopes?.[s]?.at || null) !== req.before) delete scopesReq[s];
    saveOps();
  }

  async function fetchData() {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }

  // ------------------------------------------------------------ UI-Elemente
  function setStatus(t, isErr = false) { const s = $("#status"); s.hidden = !t; s.textContent = t || ""; s.classList.toggle("err", isErr); }

  function showToast(text, undo) {
    $("#toastText").textContent = text; undoFn = undo; $("#toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("#toast").hidden = true; undoFn = null; }, 5000);
  }

  function openSheet(c) {
    const others = ["active", "suggested", "parked", "rejected"].filter((s) => s !== c.status);
    $("#sheetCard").innerHTML = `<b>${esc(c.name || c.handle)}</b>
      ${c.reason ? `<div class="meta">${esc(c.reason)}</div>` : ""}
      ${others.map((s) => `<button data-sheet-set="${s}">${STATUS_LABEL[s]}</button>`).join("")}
      <select id="sheetCat" aria-label="Kategorie">${data.config.categories.map((k) =>
        `<option value="${k.id}" ${k.id === c.category ? "selected" : ""}>Kategorie: ${esc(k.label)}</option>`).join("")}</select>
      ${c.id ? `<a class="btn" href="https://www.youtube.com/channel/${encodeURIComponent(c.id)}/videos">Kanal auf YouTube öffnen</a>` : ""}
      <button data-sheet-close>Abbrechen</button>`;
    $("#sheet").hidden = false;
    $("#sheetCard").onclick = (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.sheetSet) setChannel(c, { status: b.dataset.sheetSet });
      $("#sheet").hidden = true;
    };
    $("#sheetCat").onchange = (e) => { setChannel(c, { category: e.target.value }, { toast: false }); $("#sheet").hidden = true; };
  }

  // ------------------------------------------------------------ Events
  const byKey = (k) => channels().find((c) => keyOf(c) === k);
  $("#tabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-view]"); if (!b) return;
    view = b.dataset.view; store.set("view", view); render(); window.scrollTo({ top: 0 });
  });
  $("#cats").addEventListener("click", (e) => {
    const b = e.target.closest("[data-cat]"); if (!b) return;
    cat = b.dataset.cat; store.set("cat", cat); render();
  });
  $("#tools").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "sortBtn") { const order = Object.keys(SORTS); sorts[view] = order[(order.indexOf(sorts[view] || "new") + 1) % order.length]; store.set("sorts", sorts); }
    if (b.id === "onlyNewBtn") { onlyNew = !onlyNew; store.set("onlyNew", onlyNew); }
    if (b.id === "markAll") { for (const c of channels()) if (c.status === "active" && latest(c)) seen[c.id] = latest(c).id; store.set("seen", seen); }
    if (b.id === "searchBtn") { $("#q").hidden = !$("#q").hidden; if (!$("#q").hidden) $("#q").focus(); else $("#q").value = ""; }
    render();
  });
  $("#q").addEventListener("input", render);
  $("#list").addEventListener("click", (e) => {
    const t = e.target;
    const set = t.closest("[data-set]");
    if (set) { const c = byKey(set.dataset.k); if (c) setChannel(c, { status: set.dataset.set }); return; }
    const more = t.closest("[data-more]");
    if (more) { const c = byKey(more.dataset.more); if (c) openSheet(c); return; }
    if (t.closest("[data-older]")) { const box = t.closest(".item").querySelector(".older"); if (box) box.hidden = !box.hidden; return; }
    const a = t.closest("a[data-v]");            // Video geöffnet -> als gesehen markieren (gleicher Tab)
    if (a && view === "active") { seen[a.dataset.ch] = a.dataset.v; store.set("seen", seen); }
  });
  $("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") $("#sheet").hidden = true; });
  $("#toastUndo").addEventListener("click", () => { $("#toast").hidden = true; const f = undoFn; undoFn = null; if (f) f(); });
  $("#reload").addEventListener("click", () => {
    const scope = VIEWS.find((v) => v.id === view)?.scope;
    if (scope) { requestScope(scope); setStatus(`${VIEWS.find((v) => v.id === view).label} wird geladen …`); }
  });
  $("#settingsBtn").addEventListener("click", () => {
    const f = $("#settings"); f.hidden = !f.hidden;
    $("#token").value = store.get("ghToken", "") ? "••••••••" : "";
  });
  $("#settings").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = $("#token").value.trim();
    if (v && !v.startsWith("•")) store.set("ghToken", v);
    $("#settings").hidden = true; setStatus("");
    if (stale() && !scopesReq.active) requestScope("active"); else scheduleFlush(100);
  });
  $("#tokenClear").addEventListener("click", () => { store.del("ghToken"); $("#token").value = ""; setStatus("Token gelöscht."); });
  $("#addBtn").addEventListener("click", () => {
    let h = $("#addHandle").value.trim();
    const m = h.match(/youtube\.com\/(@[\w.\-]+)/i); if (m) h = m[1];   // auch Kanal-Links akzeptieren
    if (!h.startsWith("@")) h = "@" + h;
    if (!/^@[\w.\-]{3,30}$/.test(h)) { setStatus("Ungültiger Handle – Format: @kanalname", true); return; }
    const existing = channels().find((c) => c.handle && c.handle.toLowerCase() === h.toLowerCase());
    if (existing) { setChannel(existing, { status: "active", category: $("#addCat").value }); }
    else { ops[h.toLowerCase()] = { handle: h, status: "active", category: $("#addCat").value, tries: 0 }; saveOps(); render(); }
    requestScope("active");
    $("#addHandle").value = ""; $("#settings").hidden = true;
    view = "active"; store.set("view", view); render();
  });

  // ------------------------------------------------------------ Start
  const stale = () => !data?.scopes?.active?.at || (Date.now() - new Date(data.scopes.active.at)) / 60000 > AUTO_REFRESH_AFTER_MIN;
  async function start() {
    try { data = await fetchData(); }
    catch (e) { $("#meta").textContent = "Konnte data.json nicht laden (" + e.message + ")"; return; }
    $("#addCat").innerHTML = data.config.categories.map((k) => `<option value="${k.id}">${esc(k.label)}</option>`).join("");
    reconcile(); render();
    if (stale() && !scopesReq.active && store.get("ghToken", "")) requestScope("active");
    else if (Object.keys(ops).length || Object.keys(scopesReq).length) scheduleFlush(500);   // Liegengebliebenes erneut senden
  }
  // Rückkehr von YouTube (Zurück-Taste / bfcache): Badges aktualisieren, ggf. Feed auffrischen
  window.addEventListener("pageshow", (e) => {
    if (!e.persisted || !data) return;
    seen = store.get("seen", {}); render();
    if (stale() && !scopesReq.active && store.get("ghToken", "")) requestScope("active");
  });
  start();
})();
</script>
</body>
</html>
